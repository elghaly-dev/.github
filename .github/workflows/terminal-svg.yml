name: terminal-svg
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: elghaly-dev
          KIND: repos
          TICKER: ELGHALY
          OUT: profile/terminal.svg
        run: node scripts/terminal-svg.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/terminal.svg
          git diff --cached --quiet || (git commit -m "Update terminal chart" && git push)
